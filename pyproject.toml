[project]
name = "graphkd"
version = "0.1.0"
description = "gnn to mlp distillation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.1.0",
    "dgl==2.1.0",
    "torchdata==0.7.1",
    "numpy<2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "ipykernel>=6.0",
    "jupyter>=1.0",
    "pandas>=2.0",
    "pydantic>=2.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
